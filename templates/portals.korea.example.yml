# 공고 수집 설정 — 한국
#
# 이 파일을 프로젝트 루트에 portals.yml 로 복사한 뒤 고쳐서 씁니다.
# 해외·외국계 지원용 설정은 portals.example.yml 을 보세요.
#
# ── 이 도구가 공고를 얻는 네 갈래 ──────────────────────────────
#
#   1. 사용자가 주소를 붙여넣기        — 가장 확실하고 제한이 없습니다
#   2. 본인 명의로 발급받은 공식 열쇠  — 사람인 공개 API, 공공데이터포털
#   3. 채용 포털의 공고 목록           — robots.txt 가 허용한 범위에서
#   4. 관심 기업의 채용 페이지         — 아래 tracked_companies 에 적은 곳만
#
# ── 수집할 때 지키는 넷 ───────────────────────────────────────
#
#   · 정체를 밝힌다 — 도구 이름이 든 사용자 에이전트. 브라우저인 척하지 않는다
#   · robots.txt 를 본다 — 막아 둔 경로는 건드리지 않는다
#   · 원문 주소를 남긴다 — 공고 출처를 항상 보존한다
#   · 재배포하지 않는다 — 읽은 공고는 내 컴퓨터 밖으로 나가지 않는다
#
# 이 넷은 임의 기준이 아니라 판결이 정상적인 수집과 문제 된 수집을 가른
# 지점입니다. 서울중앙지법 2015가합517982(잡코리아 대 사람인) 1심은 "정체를
# 숨기고 출처를 지운 대량 복제", "가상사설망으로 주소를 분산하고 robots.txt 를
# 보지 않은 채 긁은 것"을 문제 삼았고, 정체를 밝히고 원문으로 보내는 검색
# 로봇은 선별 허용된다고 봤습니다.
#
# 그 사건과 야놀자 대 여기어때가 실제로 다룬 것은 경쟁 서비스가 남의
# 데이터베이스를 자기 영업에 쓴 일입니다. 개인이 자기 구직을 위해 공개된
# 공고를 읽고 자기 컴퓨터에만 두는 것과는 층위가 다릅니다.

# ── 채용 포털의 공고 목록 ─────────────────────────────────────
#
# robots.txt 가 허용한 경로만 읽습니다. 요청 전에 코드가 실제로 robots.txt 를
# 받아서 판정하고, 막힌 경로면 그 자리에서 멈춥니다(providers/_robots.mjs).
# 실측일 2026-08-21 — robots.txt 는 바뀝니다. 막히면 그때 멈춥니다.

job_boards:
  # -- 사람인 (열쇠 없이) --
  # 공개 검색 결과 페이지를 읽습니다. 아래 공식 API 와 달리 신청이 필요 없습니다.
  # 검색 조건 없이 전체를 훑지 않습니다 — searchword 나 loc_mcd 중 하나는 필요합니다.
  - name: 사람인
    provider: saramin-web
    enabled: true
    searchword: 백엔드 개발자
    count: 40               # 한 쪽에 받을 건수 (최대 100)
    max_pages: 3
    # loc_mcd: "101000"     # 지역 코드. 사람인 화면에서 검색한 뒤 주소창을 보면 나옵니다
    # exp_cd: "2"           # 경력

  # -- 잡코리아 --
  # robots.txt 가 키워드 검색(`/Search/?stext=`)을 막고 있습니다.
  # 그래서 허용된 목록 탭만 읽고, 키워드는 받아 온 목록에 대고 내 컴퓨터에서 거릅니다.
  - name: 잡코리아
    provider: jobkorea
    enabled: false
    menucode: duty          # duty 직무 · local 지역 · industry 업종 · cotype1 기업형태 · edu3 학력
    max_pages: 3
    keywords: [개발, 엔지니어, Engineer]
    # cotype: "1,2,3"       # 기업형태 코드
    # edu: "5"              # 학력 (5 대졸)

  # -- 점핏 --
  # 개발 직군만 있는 곳이라 거르는 수고가 적습니다.
  - name: 점핏
    provider: jumpit
    enabled: false
    keyword: 백엔드
    size: 50                # 한 쪽에 받을 건수 (최대 100)
    max_pages: 3

  # -- 리멤버 커리어 --
  # 여기만 요청 방식이 다릅니다. robots.txt 가 목록 경로(`/job_postings/`)를 막고
  # 있어서, 허용된 사이트맵에서 공고 번호를 얻고 **공고를 하나씩** 엽니다.
  # 그래서 limit 을 올린 만큼 요청 수가 그대로 늘어납니다. 25건이면 약 30초입니다.
  - name: 리멤버 커리어
    provider: remember
    enabled: false
    limit: 25               # 최근 등록분부터 이만큼 (최대 200)
    keywords: [개발, 엔지니어]

  # -- 원티드 --
  # **이 항목만 기본값이 꺼짐이고, 켜는 것은 쓰는 사람의 판단입니다.**
  # 실측 2026-08-21:
  #   · robots.txt 가 403 이라 우리가 그 파일을 받을 수 없습니다
  #   · 보관된 스냅샷(2026-01-08)에는 공고 데이터가 오는 `/api/` 가 금지로 적혀 있습니다
  #   · 오늘 서버의 파일이 그와 같은지는 확인할 방법이 없습니다
  #   · 허용된 `/wdlist` 화면 HTML 에는 공고가 들어 있지 않습니다
  # 도구가 대신 정하지 않습니다. 읽기로 정했다면 use_api 를 true 로 바꾸세요.
  # 나중에 robots.txt 를 받을 수 있게 되고 거기에 금지가 적혀 있으면,
  # use_api 가 켜져 있어도 멈춥니다 — 이 값이 덮는 것은 「확인할 수 없는 상태」뿐입니다.
  - name: 원티드
    provider: wanted
    enabled: false
    use_api: false
    limit: 50               # 한 쪽에 받을 건수 (최대 100)
    max_pages: 3
    # tag_type_ids: "518"   # 직무 태그 (518 = 개발)

  # -- 고용24 (옛 워크넷) --
  # 공공 채용 정보입니다. 인증키를 본인 명의로 신청해 받아야 합니다.
  #   신청 https://openapi.work.go.kr → 환경변수 WORKNET_API_KEY
  # 민간 포털에 없는 것이 여기 있습니다 — 공공기관·지자체 채용, 중소기업 공고,
  # 그리고 임금이 숫자로 공개된 공고의 비율이 높습니다.
  - name: 고용24
    provider: worknet
    enabled: false          # 인증키를 받은 뒤 true 로 바꾸세요
    display: 100            # 한 쪽에 받을 건수 (최대 100)
    max_pages: 3
    # region: "11000"       # 지역 코드
    # occupation: "133"     # 직종 코드
    # career: "2"           # 경력 (1 신입 · 2 경력 · 3 무관)

# ── 사람인 공개 API ───────────────────────────────────────────
#
# 위 saramin-web 과 같은 곳을 다른 문으로 읽습니다. 열쇠를 받아 둔 뒤에는
# 이쪽이 안정적입니다 — 화면 구조가 바뀌어도 응답 모양은 그대로이기 때문입니다.
#
# 쓰려면 본인이 직접 신청해 열쇠를 받아야 합니다.
#   1. https://oapi.saramin.co.kr/join 에서 이용 신청
#   2. 승인 후 access-key 발급
#   3. 환경변수 SARAMIN_ACCESS_KEY 에 넣기 (저장소에 커밋하지 마세요)
#
# 사람인이 정한 제한: 하루 500회, 한 번에 최대 110건, 받은 데이터 재판매 금지.
#
# job_boards:
#   - name: 사람인
#     provider: saramin
#     enabled: false          # 열쇠를 받은 뒤 true 로 바꾸세요
#     keywords: "백엔드 개발자"   # 공백이나 쉼표로 여러 개
#     count: 110
#     max_pages: 3            # 하루 한도를 생각해 적게 잡습니다
#     sort: pd                # pd 게시일 역순 · da 마감 임박순
#     # 코드값은 사람인 문서의 코드표를 보고 넣습니다
#     # loc_mcd: "101000"     # 지역
#     # job_mid_cd: "2"       # 직무 대분류
#     # job_type: "1"         # 고용형태 (1 정규직)
#     # sr: directhire        # 헤드헌팅·파견업체 공고 제외

# ── 관심 기업의 채용 페이지 ───────────────────────────────────
#
# 여기 적은 회사만 읽습니다. 전체를 훑지 않습니다.
# 국내 기업은 대부분 자체 채용 페이지를 쓰거나 국내 채용 관리 시스템을 씁니다.
# 해외 시스템(그린하우스·레버 등)을 쓰는 곳은 드뭅니다.

tracked_companies:
  # -- 국내 채용 관리 시스템(그리팅)을 쓰는 곳 --
  # 주소 형태가 {회사}.career.greetinghr.com 이면 provider 를 greetinghr 로 둡니다.
  # 페이지 안에 공고 목록이 들어 있어 추가 요청 없이 한 번에 읽습니다.
  - name: 카카오페이
    provider: greetinghr
    careers_url: https://kakaopay.career.greetinghr.com/ko/main
    enabled: true

  - name: 여기어때
    provider: greetinghr
    careers_url: https://gccompany.career.greetinghr.com/ko/main
    enabled: false

  # -- 자체 채용 페이지를 쓰는 곳 --
  # 전용 모듈이 없으므로 브라우저로 읽습니다. 느리지만 확실합니다.
  # 회사가 페이지 구조를 바꾸면 읽지 못할 수 있습니다.
  - name: 네이버
    careers_url: https://recruit.navercorp.com/
    enabled: false

  - name: 카카오
    careers_url: https://careers.kakao.com/
    enabled: false

  - name: 라인
    careers_url: https://careers.linecorp.com/ko/jobs
    enabled: false

  - name: 우아한형제들
    careers_url: https://career.woowahan.com/
    enabled: false

  - name: 토스
    careers_url: https://toss.im/career
    enabled: false

  - name: 쿠팡
    careers_url: https://www.coupang.jobs/kr/
    enabled: false

# ── 제목 거르기 ───────────────────────────────────────────────
#
# 수집한 공고 중 볼 것만 남깁니다. 자기 직무에 맞게 고치세요.

title_filter:
  positive:
    - 개발
    - 엔지니어
    - Engineer
    - Developer
    - 백엔드
    - Backend
    - 서버
  negative:
    - 인턴
    - 계약직
    - 병역
    - 산학
    - 영업
    - 마케팅

# ── 지역 거르기 ───────────────────────────────────────────────
#
# location_filter:
#   positive: [서울, 판교, 성남, 경기, 재택, 원격]
#   negative: [부산, 대구, 해외]

# ── 다시 보지 않기 ────────────────────────────────────────────
#
# 한 번 본 공고는 data/scan-history.tsv 에 기록돼 다시 나오지 않습니다.
# 공고가 다시 열리는 경우가 있으니 기간을 두고 싶으면 아래를 켭니다.
#
# scan_history:
#   recheck_after_days: 30

# ── 대상에서 뺀 곳 (기록용) ───────────────────────────────────
#
# 아래는 robots.txt 가 모든 봇에게 전면 금지를 걸었습니다.
# 위 넷 중 두 번째 규칙에 걸리므로 모듈을 만들지 않습니다.
#
#   인크루트   — robots.txt `User-agent: * → Disallow: /`
#   링크드인   — robots.txt 머리에 무단 자동화 금지 명시, 채용 검색 경로 Disallow
#
# 원티드는 뺀 것이 아니라 **기본값이 꺼짐**입니다. 위 job_boards 의 원티드 항목을 보세요.
#
# 잡플래닛·블라인드는 연봉·평판 조회용이라 성격이 다릅니다. 사람이 직접
# 열어 보는 편이 정확하고, 자동 수집 대상으로 삼지 않습니다.
