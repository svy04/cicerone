# 공고 수집 설정 — 한국
#
# 이 파일을 프로젝트 루트에 portals.yml 로 복사한 뒤 고쳐서 씁니다.
# 해외·외국계 지원용 설정은 portals.example.yml 을 보세요.
#
# ── 이 도구가 공고를 얻는 네 갈래 ──────────────────────────────
#
#   1. 사용자가 주소를 붙여넣기        — 가장 확실하고 제한이 없습니다
#   2. 본인 명의로 발급받은 공식 열쇠  — 사람인 공개 API
#   3. 관심 기업의 채용 페이지         — 아래 tracked_companies 에 적은 곳만
#   4. 연결하지 않는 곳                — 약관이 자동 수집을 금지한 플랫폼
#
# ── 왜 채용 포털을 긁지 않는가 ────────────────────────────────
#
# 사람인 기업회원 약관 제23조 ③과 원티드 개인회원 약관 제19조 7이 자동화된
# 수단으로 데이터를 모으는 것을 금지합니다. 인크루트 robots.txt 는 모든 봇에게
# 전면 금지입니다. 그리고 이 영역은 이미 법정에서 다투어졌습니다 — 잡코리아와
# 사람인의 공고 수집 분쟁은 대법원에서 확정됐고(2017다224395) 이후 120억 원에
# 합의했습니다. 야놀자와 여기어때 사건은 형사는 무죄였지만 민사에서 10억 원
# 배상이 인정됐습니다.
#
# 1심 판결이 정상적인 수집과 가른 기준이 우리에게 그대로 적용됩니다.
# 정체를 밝히는가, 원문 주소를 남기는가, robots.txt 를 보는가, 그리고
# 모은 것을 자기 서비스에 올리지 않는가. 이 도구는 넷을 다 지킵니다.
# 수집한 공고는 내 컴퓨터 안에만 있고 어디로도 나가지 않습니다.

# ── 사람인 공개 API ───────────────────────────────────────────
#
# 쓰려면 본인이 직접 신청해 열쇠를 받아야 합니다.
#   1. https://oapi.saramin.co.kr/join 에서 이용 신청
#   2. 승인 후 access-key 발급
#   3. 환경변수 SARAMIN_ACCESS_KEY 에 넣기 (저장소에 커밋하지 마세요)
#
# 사람인이 정한 제한: 하루 500회, 한 번에 최대 110건, 받은 데이터 재판매 금지.
#
# job_boards:
#   - name: 사람인
#     provider: saramin
#     enabled: false          # 열쇠를 받은 뒤 true 로 바꾸세요
#     keywords: "백엔드 개발자"   # 공백이나 쉼표로 여러 개
#     count: 110
#     max_pages: 3            # 하루 한도를 생각해 적게 잡습니다
#     sort: pd                # pd 게시일 역순 · da 마감 임박순
#     # 코드값은 사람인 문서의 코드표를 보고 넣습니다
#     # loc_mcd: "101000"     # 지역
#     # job_mid_cd: "2"       # 직무 대분류
#     # job_type: "1"         # 고용형태 (1 정규직)
#     # sr: directhire        # 헤드헌팅·파견업체 공고 제외

# ── 관심 기업의 채용 페이지 ───────────────────────────────────
#
# 여기 적은 회사만 읽습니다. 전체를 훑지 않습니다.
# 국내 기업은 대부분 자체 채용 페이지를 쓰거나 국내 채용 관리 시스템을 씁니다.
# 해외 시스템(그린하우스·레버 등)을 쓰는 곳은 드뭅니다.

tracked_companies:
  # -- 국내 채용 관리 시스템(그리팅)을 쓰는 곳 --
  # 주소 형태가 {회사}.career.greetinghr.com 이면 provider 를 greetinghr 로 둡니다.
  # 페이지 안에 공고 목록이 들어 있어 추가 요청 없이 한 번에 읽습니다.
  - name: 카카오페이
    provider: greetinghr
    careers_url: https://kakaopay.career.greetinghr.com/ko/main
    enabled: true

  - name: 여기어때
    provider: greetinghr
    careers_url: https://gccompany.career.greetinghr.com/ko/main
    enabled: false

  # -- 자체 채용 페이지를 쓰는 곳 --
  # 전용 모듈이 없으므로 브라우저로 읽습니다. 느리지만 확실합니다.
  # 회사가 페이지 구조를 바꾸면 읽지 못할 수 있습니다.
  - name: 네이버
    careers_url: https://recruit.navercorp.com/
    enabled: false

  - name: 카카오
    careers_url: https://careers.kakao.com/
    enabled: false

  - name: 라인
    careers_url: https://careers.linecorp.com/ko/jobs
    enabled: false

  - name: 우아한형제들
    careers_url: https://career.woowahan.com/
    enabled: false

  - name: 토스
    careers_url: https://toss.im/career
    enabled: false

  - name: 쿠팡
    careers_url: https://www.coupang.jobs/kr/
    enabled: false

# ── 제목 거르기 ───────────────────────────────────────────────
#
# 수집한 공고 중 볼 것만 남깁니다. 자기 직무에 맞게 고치세요.

title_filter:
  positive:
    - 개발
    - 엔지니어
    - Engineer
    - Developer
    - 백엔드
    - Backend
    - 서버
  negative:
    - 인턴
    - 계약직
    - 병역
    - 산학
    - 영업
    - 마케팅

# ── 지역 거르기 ───────────────────────────────────────────────
#
# location_filter:
#   positive: [서울, 판교, 성남, 경기, 재택, 원격]
#   negative: [부산, 대구, 해외]

# ── 다시 보지 않기 ────────────────────────────────────────────
#
# 한 번 본 공고는 data/scan-history.tsv 에 기록돼 다시 나오지 않습니다.
# 공고가 다시 열리는 경우가 있으니 기간을 두고 싶으면 아래를 켭니다.
#
# scan_history:
#   recheck_after_days: 30

# ── 연결하지 않는 곳 (기록용) ─────────────────────────────────
#
# 아래는 기술적으로 읽을 수 있어도 연결하지 않습니다.
# 기술적으로 가능하다는 것이 해도 된다는 뜻이 아닙니다.
#
#   사람인 웹사이트  — 약관 제23조 ③ 크롤링 금지 (공개 API 는 씁니다)
#   잡코리아         — 약관이 복사·재배포 금지. 크롤링 분쟁 판례 당사자
#   원티드           — 약관 제19조 7 로봇·스크래퍼 금지
#   인크루트         — robots.txt 전면 금지
#   링크드인         — robots.txt 에 무단 자동화 금지 명시
#   잡플래닛·블라인드 — 연봉·평판 조회는 사람이 직접 봅니다
#
# 이 목록을 지우고 모듈을 만들지 마세요. 사용자가 법적 위험을 지게 됩니다.
