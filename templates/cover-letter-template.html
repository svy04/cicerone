<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover Letter — {{NAME}}</title>
<style>
  /* Themeable tokens (#1837): overridable via config/profile.yml `style:`, which
     the PDF pipeline injects as a later :root block. Defaults reproduce the
     original hardcoded values, so a profile without a `style:` block is unchanged. */
  :root {
    --accent-color: #1A56A0;
    --font-family: "Helvetica", Arial, sans-serif;
    --font-size: 10pt;
    /* Matches generate-pdf.mjs's PDF_PAGE_MARGIN — the actual PDF page margin
       comes from the later @page rule injectPrintPageCss appends (which reads
       this same variable), so this default must match it exactly. */
    --page-margin: 0.6in;
  }
  @page { margin: var(--page-margin); }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    /* Disable fi/fl/ffi ligatures. Headless Chromium substitutes these letter
       pairs with the Unicode glyphs U+FB01/FB02/FB03 at PDF layout time, and PDF
       text extractors (what ATS systems read) decode them back to those
       codepoints, so "verification" becomes "veriﬁcation" and a literal keyword
       search misses it. Required ligatures (rlig) stay on. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: var(--font-family);
    font-size: var(--font-size);
    line-height: 1.4;
    color: #1a1a1a;
    background: #ffffff;
    /* Disable ligatures here as well; see the * rule above. */
    font-variant-ligatures: none;
    font-feature-settings: "liga" 0, "clig" 0, "dlig" 0;
  }

  .name {
    font-weight: 700;
    font-size: 14pt;
    margin-bottom: 3pt;
  }

  .contact, .credentials {
    font-size: 9pt;
    color: #666666;
    line-height: 1.3;
    margin-bottom: 2pt;
  }

  .contact a, .credentials a, .footnotes a {
    color: var(--accent-color);
    text-decoration: none;
  }

  .divider {
    border: none;
    border-top: 0.5pt solid #cccccc;
    margin: 6pt 0 8pt;
  }

  .role-title {
    font-weight: 700;
    font-size: 11pt;
    margin-top: 10pt;
    margin-bottom: 2pt;
  }

  .dateline {
    font-size: 9pt;
    color: #666666;
    margin-bottom: 12pt;
  }

  .greeting {
    margin-bottom: 8pt;
  }

  p {
    margin-bottom: 8pt;
  }

  .achievements {
    list-style: none;
    margin-bottom: 4pt;
  }

  .achievements li {
    margin-bottom: 5pt;
    padding-left: 14pt;
    position: relative;
  }

  .achievements li::before {
    content: "\2022";
    position: absolute;
    left: 0;
  }

  .language-closing {
    font-style: italic;
    margin-top: 4pt;
    margin-bottom: 8pt;
  }

  .signature {
    margin-top: 12pt;
    margin-bottom: 8pt;
  }

  .footnotes {
    margin-top: 10pt;
    padding-top: 4pt;
    border-top: 0.5pt solid #cccccc;
  }

  .footnotes p {
    font-size: 8pt;
    color: #888888;
    line-height: 1.3;
    margin-bottom: 3pt;
  }

  /* === 한국어 (lang="ko") ===
     번들 글꼴(Space Grotesk / DM Sans)에는 한글 글리프가 없습니다. 이 규칙이 없으면
     한국어 이력서가 리눅스나 컨테이너처럼 한글 글꼴이 없는 환경에서 두부(□)로 나옵니다.
     라틴 글꼴을 앞에 두어 영문·숫자는 그대로 두고, 한글은 브라우저가 글리프 단위로
     뒤쪽 스택에서 찾아 씁니다. lang="ja" 선례와 같은 방식입니다.
     Pretendard 를 맨 앞에 둔 이유: 한국 웹에서 가장 널리 쓰이고 정부 디자인 시스템의
     기본 서체이며, 없으면 그냥 다음 후보로 넘어갑니다. */
  html[lang="ko"] body,
  html[lang="ko"] .header h1,
  html[lang="ko"] .section-title,
  html[lang="ko"] .job-company,
  html[lang="ko"] .project-title,
  html[lang="ko"] .competency-tag,
  html[lang="ko"] .skill-category {
    font-family: 'Liberation Sans', 'Helvetica Neue', Arial,
      'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans CJK KR',
      'Noto Sans KR', 'Nanum Gothic', sans-serif;
  }

  /* 줄바꿈 규칙은 cv-template.html 의 한국어 블록과 같게 둡니다.
     line-break: strict 가 한글·문장부호 처리를 맡고, word-break 는 건드리지 않습니다. */
  html[lang="ko"] body {
    line-break: strict;
    word-break: normal;
    overflow-wrap: break-word;
  }

</style>
</head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="contact">{{CONTACT_LINE}}</div>
  {{CREDENTIALS_BLOCK}}
  <hr class="divider">

  <div class="role-title">Cover Letter: {{ROLE_TITLE}}</div>
  <div class="dateline">{{DATELINE}}</div>

  {{GREETING_BLOCK}}
  <p>{{OPENING}}</p>
  <p>{{PROFILE_INTRO}}</p>

  {{ACHIEVEMENTS_BLOCK}}

  {{PROBLEMS_BLOCK}}
  {{CLOSING_BLOCK}}
  {{LANGUAGE_CLOSING_BLOCK}}
  {{SIGNATURE_BLOCK}}
  {{FOOTNOTES_BLOCK}}
</body>
</html>
