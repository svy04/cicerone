# 프로필 설정 — 한국 취업 시장
# 이 파일을 config/profile.yml 로 복사한 뒤 내 정보로 채웁니다.
# 모든 모드가 이 파일을 내 개인 정보의 유일한 출처로 씁니다.

candidate:
  name: "홍길동"
  email: "gildong@example.com"
  phone: "010-0000-0000"
  # 거주 지역. 출퇴근 가능 범위를 판단하는 데 씁니다.
  location: "서울 강남구"
  # 아래는 있는 것만 적습니다. 없으면 비워 둡니다.
  github: "github.com/gildong"
  portfolio_url: "https://gildong.dev"
  linkedin: "linkedin.com/in/gildong"
  # 이력서 사진. 한국에서 사진은 법으로 금지된 항목이 아니고,
  # 정부는 본인 확인 목적으로 붙일 수 있다고 설명합니다.
  # 다만 요구하지 않는 곳도 많으니 넣을지는 본인이 정합니다.
  # 넣으려면 파일 경로나 data URL 을 적고, 비워 두면 사진 없는 서식으로 만듭니다.
  photo: ""
  photo_style: rounded   # rounded | circle | square

# ── 지원 대상 ────────────────────────────────────────────────
target:
  # 신입 | 경력 — 전형 트랙 판정과 서류 구성이 이 값에 따라 갈립니다.
  career_stage: "경력"
  # 경력이면 연차를 적습니다. 신입이면 0.
  years: 5
  # 노리는 직무. 실제 공고에 쓰이는 이름으로 적습니다.
  roles:
    - "백엔드 개발자"
    - "플랫폼 엔지니어"
  # 선호하는 채용 방식. 둘 다 보려면 both.
  #   공채  — 정해진 기간에 모집, 자기소개서 문항과 인적성검사가 있음
  #   수시  — 상시 모집, 직무 단위, 이력서와 경력기술서 중심
  track: "수시"        # 공채 | 수시 | both
  # 관심 회사 유형. 평가할 때 보상 신뢰도 판단에 씁니다.
  company_types:
    - "투자 유치 스타트업"
    - "대기업 계열사"

# ── 나를 설명하는 것 ─────────────────────────────────────────
narrative:
  # 한 줄 소개
  headline: "결제 시스템을 만들어 온 백엔드 개발자"
  # 왜 지금 옮기려 하는가. 자기소개서와 면접에서 반복해 쓰입니다.
  move_reason: "트래픽 규모가 큰 서비스에서 안정성 문제를 정면으로 다루고 싶습니다."
  # 내가 잘하는 것 서너 개
  strengths:
    - "대용량 트래픽 처리"
    - "장애 대응과 사후 분석"
    - "팀 간 조율"
  # 증거가 되는 결과물. 수치가 있으면 함께 적습니다.
  proof_points:
    - name: "결제 정산 시스템 개편"
      hero_metric: "정산 지연 건수 월 300건에서 5건으로"
    - name: "오픈소스 기여"
      url: "https://github.com/gildong/project"
      hero_metric: "별 200개"

# ── 보상 ─────────────────────────────────────────────────────
compensation:
  # 세전 계약 연봉 기준으로 적습니다. 단위는 만 원.
  target: 7000
  # 이 아래로는 가지 않는 선
  minimum: 6000
  # 현재 연봉. 적어 두면 인상률 계산에 씁니다. 밝히기 싫으면 비웁니다.
  current: 6200
  # 아래 항목을 오퍼에서 반드시 확인하게 합니다. 기본값을 그대로 두길 권합니다.
  must_verify:
    - "퇴직금이 제시 연봉에 포함되는지"
    - "고정 초과근로수당이 포함되는지, 몇 시간분인지"
    - "성과급이 제시 연봉에 포함되는지 별도인지"
    - "수습기간 급여 감액이 있는지"

# ── 근무 조건 ────────────────────────────────────────────────
work:
  # 출퇴근 가능한 지역
  commute_areas:
    - "서울 강남권"
    - "판교"
  # 선호 근무 형태
  preferred_mode: "하이브리드"   # 전면재택 | 하이브리드 | 상시출근 | 무관
  # 받아들일 수 있는 고용 형태. 목록에 없는 형태는 위험 신호로 표시됩니다.
  employment_types:
    - "정규직"
  # 포괄임금제를 받아들일 수 있는가
  accept_inclusive_wage: false
  # 이직 시 필요한 인수인계 기간(일)
  notice_period_days: 30

# ── 자격 ─────────────────────────────────────────────────────
credentials:
  # 어학 성적. 공채는 요구하는 곳이 있습니다.
  language_tests:
    - name: "토익"
      score: "900"
      date: "2025-03"
  certifications:
    - "정보처리기사"
  # 병역. 공채 지원서에 칸이 있는 경우가 많습니다.
  # 적기 싫으면 통째로 지웁니다. 도구가 강제하지 않습니다.
  military: "만기전역"

# ── 조직 문화 조건 ───────────────────────────────────────────
# 여기에 적은 조건은 평가의 조직 신호 점수에 반영됩니다.
# 조건과 어긋나는 증거가 나오면 그 항목이 2점으로 제한됩니다.
culture_screen:
  require:
    - "코드 리뷰 문화가 있음"
    - "야근이 상시가 아님"
  # true 로 두면 증거가 아예 없을 때도 2점으로 제한합니다.
  deprioritize_if_absent: false

# ── 지원하지 않을 곳 ─────────────────────────────────────────
# data/blacklist.md 에 회사명과 이유를 적습니다. 도구가 자동으로 추가하지 않습니다.

# ── 출력 ─────────────────────────────────────────────────────
language:
  # 보고서와 서류의 언어. 공고가 영어면 그 공고에 한해 영어로 씁니다.
  output: ko

# 평가에 쓸 모델 등급. economy | standard | premium
# 기본값은 standard 입니다.
spend_tier: standard

# ── 서류 ─────────────────────────────────────────────────────
documents:
  # 이력서 출력 형식
  output_format: "html"    # html | latex
  # 이력서 서식. templates/ 의 cv-template.<이름>.html 을 가리킵니다.
  # template: korea-standard
  # 이력서 목표 분량(장). 한국에서는 두세 장이 통상입니다.
  resume_pages: 2
  # 경력기술서를 따로 만들지 여부. 경력 지원이면 true 를 권합니다.
  career_description: true

# ── 자기소개서 ───────────────────────────────────────────────
# 이 도구는 문항마다 자기소개서 초안을 만듭니다.
# 문항을 풀고, 쓸 재료를 배정하고, 글자 수를 맞춰 씁니다.
# 고쳐 쓰면 좋은 자리를 함께 표시합니다.
#
# 알아 둘 것: 한국 기업 일부가 인공지능 작성 여부를 검사합니다.
# 초안을 본인 말로 고쳐 쓰기를 권합니다. 판단은 본인 몫입니다.
cover_letter:
  # 자기소개서를 요구하는 공고를 만났을 때 문항 정리를 자동으로 할지
  auto_parse_questions: true
  # 글자 수는 보통 공백을 포함해 셉니다.
  count_spaces: true

# ── 공고 수집 ────────────────────────────────────────────────
# 이 도구는 이용약관이 자동 수집을 금지한 채용 사이트를 긁지 않습니다.
# 쓸 수 있는 경로는 아래 셋입니다.
scan:
  # 1) 사람인 공개 API. 본인이 직접 신청해 발급받은 키를 넣습니다.
  #    신청: https://oapi.saramin.co.kr/join
  #    하루 500회 제한이 있고, 받은 데이터를 되팔 수 없습니다.
  # saramin_access_key: ""
  #
  # 2) 공공데이터포털 인증키 (고용24 채용 정보)
  #    신청: https://www.data.go.kr
  # data_go_kr_key: ""
  #
  # 3) 관심 기업의 채용 페이지. portals.yml 에 목록을 적습니다.
  #    지정한 회사만 읽고, robots.txt 를 따르고, 요청 간격을 지킵니다.
  #
  # 공고 본문을 읽는 방식. mcp 가 기본이고, cli 는 토큰을 아낍니다.
  extractor: mcp

# ── 평가 ─────────────────────────────────────────────────────
# 이 점수 이상일 때만 맞춤 이력서를 자동으로 만듭니다.
# 서류 한 벌을 만드는 데 시간이 걸리므로 걸러 냅니다.
# auto_pdf_score_threshold: 4.0

pipeline:
  # 전체 평가 전에 가볍게 거르는 1차 점수 기준
  triage_threshold: 3.5
  # 이 수보다 적으면 1차 거르기를 건너뜁니다
  triage_min_urls: 5

# ── 다시 지원하지 않을 기간 ──────────────────────────────────
# re_apply_windows:
#   회사이름:
#     same_role_days: 180
#     applied_to: ["백엔드 개발자"]
#     last_apply_date: "2026-01-01"
